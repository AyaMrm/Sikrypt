[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
des = "0.8"
ed25519-dalek = "2.1"
hmac = "0.12"
hkdf = "0.12"
num-bigint-dig = { version = "0.8", features = ["rand"] }
num-integer = "0.1"
num-traits = "0.2"
once_cell = "1.21"
futures-util = "0.3"
rand = "0.8"
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signature = "2.2"
tokio = { version = "1.48", features = ["full"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.5", features = ["trace", "limit", "timeout", "request-id", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
